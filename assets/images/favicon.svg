<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2E59" />
      <stop offset="100%" stop-color="#071933" />
    </linearGradient>
    <linearGradient id="favWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF" />

  <!-- Outer Ring Swoosh -->
  <path d="M 32,4 C 48,4 58,14 58,28 C 58,38 54,46 47,52" 
        stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 6,30 C 6,16 16,5 32,4" 
        stroke="#0284C7" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 12,42 C 17,50 28,58 42,56" 
        stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Drain Outer Rim -->
  <ellipse cx="32" cy="44" rx="20" ry="9" fill="#0B2545" />
  <ellipse cx="32" cy="44" rx="16" ry="7" fill="#FFFFFF" />
  <ellipse cx="32" cy="44.5" rx="14" ry="5.5" fill="#0B2545" />
  <circle cx="26" cy="44.5" r="1.1" fill="#FFFFFF" />
  <circle cx="30" cy="46" r="1.1" fill="#FFFFFF" />
  <circle cx="34" cy="46" r="1.1" fill="#FFFFFF" />
  <circle cx="38" cy="44.5" r="1.1" fill="#FFFFFF" />

  <!-- Water Splash Droplets -->
  <circle cx="21" cy="27" r="2.2" fill="#0284C7" />
  <circle cx="18" cy="33" r="1.8" fill="#38BDF8" />
  <circle cx="15" cy="38" r="1.5" fill="#0284C7" />

  <!-- Pipe Elbow -->
  <rect x="38" y="4" width="14" height="5" rx="1" fill="#0B2545" />
  <path d="M 40,9 L 40,21 C 40,25 37,29 33,31 L 30,32 C 29,32.5 29,34 30,35 C 38,34 45,28 45,21 L 45,9 Z" fill="url(#favPipe)" />
  <path d="M 43,10 L 43,19 C 43,23 39,26 35,27" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Water Flow from Spout -->
  <path d="M 30,32 C 28,35 29,39 31,44 C 33,44 34,41 34,38 C 34,35 32,33 30,32 Z" fill="url(#favWater)" />
</svg>
